<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questão 03 - Formulário de Cadastro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 350px;
    }
    input, select, button {
      padding: 8px;
    }
    table {
      margin-top: 20px;
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid gray;
      padding: 8px;
      text-align: left;
    }
    #mensagem {
      color: red;
    }
    pre {
      background-color: #eee;
      padding: 10px;
      overflow-x: auto;
    }
  </style>
</head>
<body>

  <h1>Cadastro</h1>

  <form id="formCadastro">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required>

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" required>

    <label for="idade">Idade:</label>
    <input type="number" id="idade" name="idade" min="1" max="120" required>

    <label for="curso">Curso:</label>
    <select id="curso" name="curso" required>
      <option value="">Selecione um curso</option>
      <option value="Engenharia de Software">Engenharia de Software</option>
      <option value="Engenharia Civil">Engenharia Civil</option>
      <option value="Engenharia Mecânica">Engenharia Mecânica</option>
    </select>

    <button type="submit">Cadastrar</button>
  </form>

  <h2>Dados em JSON</h2>
  <pre id="json"></pre>

  <h2>Usuários Cadastrados</h2>
  <table id="tabelaUsuarios">
    <thead>
      <tr>
        <th>Nome</th>
        <th>E-mail</th>
        <th>Idade</th>
        <th>Curso</th>
      </tr>
    </thead>
    <tbody id="tabelaCorpo">
    </tbody>
  </table>

  <script>
    const formCadastro = document.getElementById("formCadastro");
    const jsonPre = document.getElementById("json");
    const tabelaCorpo = document.getElementById("tabelaCorpo");

    formCadastro.addEventListener("submit", (evento) => {
      evento.preventDefault();

      const formData = new FormData(formCadastro);
      const objeto = {};

      // Coleta os dados percorrendo com for...of
      for (const [chave, valor] of formData.entries()) {
        objeto[chave] = valor;
      }

      // Exibe objeto JSON formatado
      jsonPre.textContent = JSON.stringify(objeto, null, 2);

      // Adiciona linha na tabela
      const tr = document.createElement("tr");

      const tdNome = document.createElement("td");
      tdNome.textContent = objeto.nome;

      const tdEmail = document.createElement("td");
      tdEmail.textContent = objeto.email;

      const tdIdade = document.createElement("td");
      tdIdade.textContent = objeto.idade;

      const tdCurso = document.createElement("td");
      tdCurso.textContent = objeto.curso;

      tr.appendChild(tdNome);
      tr.appendChild(tdEmail);
      tr.appendChild(tdIdade);
      tr.appendChild(tdCurso);

      tabelaCorpo.appendChild(tr);

      // Limpa os campos do formulário
      formCadastro.reset();
    });
  </script>
</body>
</html>
