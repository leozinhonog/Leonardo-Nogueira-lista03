<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questão 01 - Cards de Usuários</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    #cards {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .card {
      border: 1px solid gray;
      padding: 15px;
      width: 250px;
      cursor: pointer;
      border-radius: 4px;
    }
    .card.selecionado {
      border: 2px solid blue;
      background-color: lightblue;
    }
    #total {
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>Usuários</h1>
  <div id="cards"></div>
  <div id="total"></div>

  <script>
    const usuarios = [
      { id: 1, name: "Leanne Graham", email: "Sincere@april.biz", address: { city: "Gwenborough" }, company: { name: "Romaguera-Crona" } },
      { id: 2, name: "Ervin Howell", email: "Shanna@melissa.tv", address: { city: "Wisokyburgh" }, company: { name: "Deckow-Crist" } },
      { id: 3, name: "Clementine Bauch", email: "Nathan@yesenia.net", address: { city: "McKenziehaven" }, company: { name: "Romaguera-Jacobson" } },
      { id: 4, name: "Patricia Lebsack", email: "Julianne.OConner@kory.org", address: { city: "South Elvis" }, company: { name: "Robel-Corkery" } }
    ];

    const cardsContainer = document.getElementById("cards");

    usuarios.forEach((usuario) => {
      const card = document.createElement("div");
      card.className = "card";

      // Adiciona funcionalidade de seleção ao clicar no card
      card.addEventListener("click", () => {
        card.classList.toggle("selecionado");
      });

      const nome = document.createElement("h3");
      nome.textContent = usuario.name;
      nome.style.marginTop = "0";

      const email = document.createElement("p");
      email.innerHTML = `<strong>E-mail:</strong> ${usuario.email}`;

      const cidade = document.createElement("p");
      cidade.innerHTML = `<strong>Cidade:</strong> ${usuario.address.city}`;

      const empresa = document.createElement("p");
      empresa.innerHTML = `<strong>Empresa:</strong> ${usuario.company.name}`;

      card.appendChild(nome);
      card.appendChild(email);
      card.appendChild(cidade);
      card.appendChild(empresa);

      cardsContainer.appendChild(card);
    });

    const totalDiv = document.getElementById("total");
    totalDiv.textContent = `Total de usuários: ${usuarios.length}`;
  </script>
</body>
</html>
